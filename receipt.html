<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt | Campus Snack Bar POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2033;--muted:#6b7089;--bg:#f3f4f9;--card:#fff;--line:#e4e6f0;--red:#d9372b;--red-d:#b92a20;--mustard:#f6b91e;--green:#2f8a52;--green-d:#246f41;--green-bg:#e6f5ec;--err:#c62828;--err-bg:#fdeaea;--r:18px;--sh:0 10px 30px -12px rgba(28,32,51,.28);--font:'Outfit','Segoe UI',system-ui,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.4}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
header{background:var(--ink);color:#fff;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:46px;border-radius:14px;transition:transform .3s}
.brand:hover img{transform:rotate(-8deg) scale(1.08)}
.brand h1{font-size:1.3rem;font-weight:800}
.brand p{font-size:.8rem;color:#aab0cc}
nav.top{display:flex;gap:6px}
nav.top a{padding:9px 16px;border-radius:999px;font-weight:600;color:#cfd3ea;transition:background .2s,color .2s;display:flex;align-items:center;gap:8px}
nav.top a:hover,nav.top a.on{background:#fff;color:var(--ink)}
.pill{background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;padding:0 6px;font-size:.78rem;display:none;place-items:center}
.pill.show{display:grid}
.steps{display:flex;gap:8px;padding:16px 28px 0;max-width:1200px;margin:0 auto;overflow-x:auto}
.step{flex:1;min-width:130px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--card);border:2px solid transparent;color:var(--muted);font-weight:500;font-size:.92rem;transition:all .35s}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.step.done{color:var(--green)}.step.done i{background:var(--green);color:#fff}
.step.on{color:var(--ink);border-color:var(--red);box-shadow:var(--sh)}.step.on i{background:var(--red);color:#fff}
main{max-width:1200px;margin:0 auto;padding:18px 28px 90px;animation:in .5s ease-out}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{font-size:1.6rem;font-weight:800;margin-bottom:4px}
.lead{color:var(--muted);margin-bottom:18px}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;font-weight:700;font-size:1rem;transition:background .2s,transform .15s,color .2s;border:2px solid transparent}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}
.btn.green{background:var(--green);color:#fff}.btn.green:hover{background:var(--green-d)}
.btn.ghost{border-color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:#fff}
.btn:disabled,.btn.off{background:var(--line);color:var(--muted);border-color:transparent;cursor:not-allowed;transform:none;pointer-events:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,160px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-weight:500;box-shadow:var(--sh);transition:transform .35s cubic-bezier(.3,1.5,.5,1);z-index:80;pointer-events:none}
.toast.show{transform:translate(-50%,0)}
@media(max-width:700px){header,.steps{padding-inline:14px}main{padding:16px 14px 90px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

.rwrap{max-width:420px;margin:10px auto 0}
.receipt{font-family:'Courier New',monospace;font-size:.92rem;background:#fffef7;border:1px solid var(--line);padding:24px 20px;border-radius:6px;position:relative;margin-bottom:22px;box-shadow:var(--sh);animation:slide .7s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,#fffef7 0) 0 0/12px 8px,linear-gradient(45deg,transparent 6px,#fffef7 0) 0 0/12px 8px}
.receipt .c{text-align:center}.receipt h3{font-size:1.2rem;letter-spacing:.05em}
.receipt hr{border:0;border-top:1px dashed #999;margin:12px 0}
.receipt table{width:100%;border-collapse:collapse}
.receipt td{padding:2px 0;vertical-align:top}.receipt td:last-child{text-align:right;white-space:nowrap}
.receipt .t td{font-weight:700;font-size:1.05rem}
.acts{display:flex;flex-direction:column;gap:10px}
@media print{header,.steps,.acts,.toast{display:none!important}body{background:#fff}main{padding:0;animation:none}.receipt{box-shadow:none;border:0;animation:none}.receipt::after{display:none}}
</style>
</head>
<body>
<header><a class="brand" href="index.html"><img src="images/logo.svg" alt="Campus Snack Bar logo"><div><h1>Campus Snack Bar</h1><p>Point of Sale · Cashier Counter</p></div></a></header>
<div class="steps" aria-label="Transaction progress"><div class="step done"><i>1</i>Browse</div><div class="step done"><i>2</i>Review order</div><div class="step done"><i>3</i>Payment</div><div class="step done"><i>4</i>Confirmation</div><div class="step on"><i>5</i>Receipt</div></div>
<main>

<div class="rwrap">
  <div class="receipt" id="receipt"></div>
  <div class="acts">
    <button class="btn red" id="newTx">Start new transaction</button>
    <button class="btn ghost" id="print">Print receipt</button>
  </div>
</div>

</main>
<div class="toast" id="toast" role="status"></div>
<script src="js/store.js"></script>
<script>
const $=id=>document.getElementById(id);

Store.guard('result');
const tx=Store.tx();
if(tx){
  const d=new Date(tx.date);
  $('receipt').innerHTML=`<div class="c"><h3>CAMPUS SNACK BAR</h3>Davao del Norte State College<br>Official Receipt</div><hr>
  Txn No: ${tx.ref}<br>Date: ${d.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'2-digit'})}<br>Time: ${d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}<hr>
  <table>${tx.lines.map(l=>`<tr><td colspan="2">${l.name}</td></tr><tr><td>&nbsp;&nbsp;${l.qty} x ${peso(l.unit)}</td><td>${peso(l.sub)}</td></tr>`).join('')}</table><hr>
  <table><tr class="t"><td>TOTAL</td><td>${peso(tx.total)}</td></tr><tr><td>Cash</td><td>${peso(tx.cash)}</td></tr><tr><td>Change</td><td>${peso(tx.change)}</td></tr></table><hr>
  <div class="c">Thank you! Come again.</div>`;
}
$('newTx').addEventListener('click',()=>{Store.reset();location.href='index.html';});
$('print').addEventListener('click',()=>window.print());

</script>
</body>
</html>
